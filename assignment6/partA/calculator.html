<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - Assignment 6 Part A</title>
    <!-- Bootstrap Material Design -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.2.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-material-design/4.1.3/bootstrap-material-design.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">
    <div class="container py-5">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h3 id="welcomeMessage"></h3>
            <button class="btn btn-danger" id="logoutBtn">Logout</button>
        </header>

        <div class="card bg-secondary text-light p-4">
            <div class="mb-3">
                <label class="form-label">Number 1</label>
                <input type="text" class="form-control" id="num1">
                <div class="form-text text-danger" id="num1Error"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Number 2</label>
                <input type="text" class="form-control" id="num2">
                <div class="form-text text-danger" id="num2Error"></div>
            </div>
            <div class="mb-3 d-flex gap-2 flex-wrap">
                <button class="btn btn-primary calc-btn" data-op="add">Add</button>
                <button class="btn btn-primary calc-btn" data-op="subtract">Subtract</button>
                <button class="btn btn-primary calc-btn" data-op="multiply">Multiply</button>
                <button class="btn btn-primary calc-btn" data-op="divide">Divide</button>
            </div>
            <div class="mb-3">
                <label class="form-label">Result</label>
                <input type="text" class="form-control" id="result" readonly>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.2.3/js/bootstrap.bundle.min.js"></script>
    <script>
        $(function() {
            function getSession() {
                return JSON.parse(sessionStorage.getItem('userSession') || localStorage.getItem('userSession') || 'null');
            }
            const sess = getSession();
            if (!sess || !sess.isLoggedIn) {
                window.location.href = 'login.html';
                return;
            }
            $('#welcomeMessage').text(`Welcome, ${sess.username}!`);
            $('#logoutBtn').click(() => {
                sessionStorage.removeItem('userSession');
                localStorage.removeItem('userSession');
                $('.container').fadeOut(800, () => window.location.href = 'login.html');
            });

            const $num1 = $('#num1');
            const $num2 = $('#num2');
            const $num1Error = $('#num1Error');
            const $num2Error = $('#num2Error');
            const $result = $('#result');

            function validateNumber($field, $error) {
                const v = $field.val().trim();
                if (v === '' || isNaN(v)) {
                    $error.text('Please enter a valid number');
                    return false;
                }
                $error.text('');
                return true;
            }

            const calculate = (num1, num2, operation) => {
                switch (operation) {
                    case 'add': return num1 + num2;
                    case 'subtract': return num1 - num2;
                    case 'multiply': return num1 * num2;
                    case 'divide': return num2 === 0 ? 'Infinity' : num1 / num2;
                }
            };

            $('.calc-btn').click(function() {
                const op = $(this).data('op');
                const ok1 = validateNumber($num1, $num1Error);
                const ok2 = validateNumber($num2, $num2Error);
                if (!ok1 || !ok2) return;
                const n1 = parseFloat($num1.val());
                const n2 = parseFloat($num2.val());
                const res = calculate(n1, n2, op);
                $result.val(res);
            });
        });
    </script>
</body>
</html>
