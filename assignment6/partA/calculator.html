<!DOCTYPE html>
<html lang="en" data-mdb-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Calculator Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.1.0/mdb.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container py-5" id="calcPage">
        <header class="d-flex justify-content-between align-items-center mb-5 bg-dark p-3 rounded shadow-2">
            <h4 id="welcomeMessage" class="mb-0 text-primary"></h4>
            <button class="btn btn-danger" id="logoutBtn">Logout</button>
        </header>

        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4">
                    <div class="mb-3">
                        <label class="form-label">Number 1</label>
                        <input type="text" class="form-control" id="num1">
                        <div id="num1Error" class="error-msg"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Number 2</label>
                        <input type="text" class="form-control" id="num2">
                        <div id="num2Error" class="error-msg"></div>
                    </div>
                    <div class="d-flex gap-2 mb-4">
                        <button class="btn btn-primary flex-fill calc-btn" data-op="add">Add</button>
                        <button class="btn btn-primary flex-fill calc-btn" data-op="subtract">Subtract</button>
                        <button class="btn btn-primary flex-fill calc-btn" data-op="multiply">Multiply</button>
                        <button class="btn btn-primary flex-fill calc-btn" data-op="divide">Divide</button>
                    </div>
                    <div>
                        <label class="form-label">Result</label>
                        <input type="text" class="form-control result-display" id="result" readonly disabled>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
