<!DOCTYPE html>
<html lang="en" data-mdb-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Calculator Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.1.0/mdb.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container d-flex vh-100 align-items-center justify-content-center">
        <div class="card p-4" style="width: 100%; max-width: 400px;">
            <h3 class="text-center mb-4">Calculator Login</h3>
            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="user@northeastern.edu">
                    <div id="emailError" class="error-msg"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Min 8 characters">
                    <div id="passwordError" class="error-msg"></div>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember Me</label>
                </div>
                <div id="loginError" class="error-msg text-center mb-2"></div>
                <button type="submit" id="loginBtn" class="btn btn-primary w-100" disabled>Login</button>
                <div id="successMsg" class="alert alert-success mt-3 d-none">Success! Redirecting...</div>
            </form>
            <div class="test-credentials mt-4">
                <strong>Test User:</strong><br>
                balakrishnan.vi@northeastern.edu / P@ssw0rd
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
